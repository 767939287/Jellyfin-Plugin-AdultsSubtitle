# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: "🚀 Publish Plugin"

on:
  workflow_dispatch: ## 手动临时执行
  push:
    tags: 
      - "v*"

# 需要写权限才能把更新后的 manifest 提交回仓库
permissions:
  contents: write

env:
  dotnet-version: 10.0.x
  python-version: 3.8
  artifact: subtitle


jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Release
  
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          
      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.python-version }}
          
      - name: Initialize workflow variables
        id: vars
        run: |
          VERSION=$(echo "${GITHUB_REF#refs/*/}" | sed s/^v//)
          VERSION="$VERSION.0"
          CHANGE_LOG=$(git tag -l '--format=%(contents)' ${{ github.ref_name }})
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "CHANGE_LOG=${CHANGE_LOG}" >> $GITHUB_OUTPUT
          echo "APP_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish --configuration Release --output bin

      - name: Publish Emby
        run: dotnet publish --configuration Release.Emby --output bin.Emby

      - name: Package
        id: create_package
        shell: bash
        run: |
          # push tag 触发时，github.ref_name 就是 tag 名（如 v2.4.0.0），比 git describe 更可靠
          tag="${{ github.ref_name }}"
          release_name="AdultsSubtitle_${tag}"
          emby_release_name="AdultsSubtitle_Emby_${tag}"
          
          # Pack files
          7z a -tzip "${release_name}.zip" "./bin/*"
          7z a -tzip "${emby_release_name}.zip" "./bin.Emby/*"

          # 使用新的 GITHUB_OUTPUT（::set-output 已废弃，会导致 outputs 为空）
          {
            echo "release_name=${release_name}"
            echo "release_tag=${tag}"
            echo "filename=${release_name}.zip"
            echo "emby_release_name=${emby_release_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.create_package.outputs.release_tag }}"
          name: "${{ steps.create_package.outputs.release_tag }}"
          prerelease: false
          files: |
            *.zip

      - name: Generate manifest
        run: python3 ./scripts/generate_manifest.py "${{ steps.create_package.outputs.release_name }}.zip" "${{ steps.create_package.outputs.release_tag }}"
        env:
          CN_DOMAIN: ${{ vars.CN_DOMAIN }}

      - name: Commit & Push manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: master
          commit_message: "update manifest for ${{ steps.create_package.outputs.release_tag }}"
          file_pattern: "manifest*.json"

