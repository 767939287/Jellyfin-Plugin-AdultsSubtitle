# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: "🚀 Publish Plugin"

on:
  workflow_dispatch: ## 手动临时执行
  push:
    tags: 
      - "v*"
env:
  dotnet-version: 8.0.x
  python-version: 3.8
  artifact: subtitle


jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Release
  
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          
      - name: Initialize workflow variables
        id: vars
        run: |
          VERSION=$(echo "${GITHUB_REF#refs/*/}" | sed s/^v//)
          VERSION="$VERSION.0"
          CHANGE_LOG=$(git tag -l '--format=%(contents)' ${{ github.ref_name }})
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "CHANGE_LOG=${CHANGE_LOG}" >> $GITHUB_OUTPUT
          echo "APP_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish --configuration Release --output bin

      - name: Publish Emby
        run: dotnet publish --configuration Release.Emby --output bin.Emby

      - name: Package
        id: create_package
        shell: bash
        run: |
          tag=$(git describe --tags --always)
          release_name="AdultsSubtitle_${tag}"
          emby_release_name="AdultsSubtitle_Emby_${tag}"
          
          # Pack files
          7z a -tzip "${release_name}.zip" "./bin/*"
          echo "::set-output name=release_name::${release_name}"
          echo "::set-output name=release_tag::${tag}"
          echo "::set-output name=filename::${release_name}.zip"
          
          7z a -tzip "${emby_release_name}.zip" "./bin.Emby/*"
          echo "::set-output name=emby_release_name::${emby_release_name}"
          echo "::set-output name=emby_release_name::${tag}"
          echo "::set-output name=filename::${emby_release_name}.zip"

      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          name: "${{ steps.create_package.outputs.release_tag }}"
          automatic_release_tag: "${{ steps.create_package.outputs.release_tag }}"
          prerelease: false
          #          "${{ steps.create_package.outputs.filename }}"
          files: |
            *.zip
      - name: Generate manifest
        run: python3 ./scripts/generate_manifest.py ./artifacts/${{ env.artifact }}_${{steps.vars.outputs.VERSION}}.zip ${GITHUB_REF#refs/*/}
        env:
          CN_DOMAIN: ${{ vars.CN_DOMAIN }}
      - name: Publish manifest
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./manifest*.json
          tag: "manifest"
          overwrite: true
          file_glob: true
